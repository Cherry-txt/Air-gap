<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>AIRGAP — QR file relay</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
  :root {
    --bg: #12151a;
    --bg-panel: #1a1f26;
    --bg-panel-raised: #212832;
    --grid-line: #1b2028;
    --border: #2a3038;
    --text: #e8eaed;
    --text-muted: #8a93a0;
    --text-dim: #545c68;
    --tx: #ffb454;
    --tx-dim: #3a2e1c;
    --rx: #5ec8d8;
    --rx-dim: #1e343a;
    --good: #6ee7a8;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Consolas, monospace;
    --font-sans: 'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--bg);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 22px 22px;
    color: var(--text);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }

  .hidden { display: none !important; }

  :focus-visible { outline: 2px solid var(--tx); outline-offset: 2px; }

  .shell {
    max-width: 420px;
    margin: 0 auto;
    padding: 28px 18px 40px;
  }

  .topbar { text-align: center; margin-bottom: 22px; }
  .wordmark {
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.14em;
    color: var(--text);
  }
  .wordmark::before { content: "[ "; color: var(--text-dim); }
  .wordmark::after { content: " ]"; color: var(--text-dim); }
  .tagline {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 6px;
    letter-spacing: 0.02em;
  }

  .rocker {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    max-width: 280px;
    height: 50px;
    margin: 0 auto 26px;
    padding: 4px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .rocker-thumb {
    position: absolute;
    top: 4px; left: 4px;
    width: calc(50% - 6px);
    height: calc(100% - 8px);
    border-radius: 5px;
    background: var(--tx-dim);
    border: 1px solid var(--tx);
    transition: transform 0.22s ease, background 0.22s ease, border-color 0.22s ease;
    z-index: 0;
  }
  .rocker[data-active="rx"] .rocker-thumb {
    transform: translateX(calc(100% + 6px));
    background: var(--rx-dim);
    border-color: var(--rx);
  }
  .rocker-half {
    position: relative;
    z-index: 1;
    background: transparent;
    border: none;
    border-radius: 5px;
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.12em;
    color: var(--text-dim);
    cursor: pointer;
    padding: 0;
  }
  .rocker[data-active="tx"] .tx-half,
  .rocker[data-active="rx"] .rx-half {
    color: var(--text);
  }

  .panel { display: flex; flex-direction: column; }

  .file-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .btn-outline {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.04em;
    padding: 10px 14px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-outline:hover { border-color: var(--text-dim); color: var(--text); }
  .file-readout {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .qr-frame {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    max-width: 300px;
    margin: 0 auto 18px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #qrcode { display: flex; align-items: center; justify-content: center; }
  #qrcode img, #qrcode canvas { display: block; border-radius: 4px; }

  .scan-sweep {
    position: absolute;
    left: 6%; right: 6%;
    height: 2px;
    top: -5%;
    background: linear-gradient(90deg, transparent, var(--tx), transparent);
    opacity: 0;
    pointer-events: none;
  }
  .qr-frame.active .scan-sweep {
    opacity: 1;
    animation: sweep 1.3s linear infinite;
  }
  @keyframes sweep {
    0% { top: -5%; }
    100% { top: 103%; }
  }

  .msg-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    font-family: var(--font-mono);
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--text-muted);
    background: var(--bg-panel);
    z-index: 2;
  }
  .msg-overlay.complete-msg { color: var(--good); }

  .readout-strip {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }
  .readout {
    flex: 1;
    min-width: 0;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
  }
  .readout-label {
    display: block;
    font-family: var(--font-mono);
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .readout-value {
    display: block;
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .meter {
    height: 10px;
    border-radius: 2px;
    background: var(--bg-panel-raised);
    border: 1px solid var(--border);
    overflow: hidden;
    margin-bottom: 20px;
    position: relative;
  }
  .meter-fill {
    position: absolute; inset: 0;
    width: 0%;
    background-color: var(--tx);
    background-image: repeating-linear-gradient(90deg, transparent 0 3px, var(--bg-panel) 3px 5px);
    transition: width 0.15s linear;
  }

  .controls { margin-bottom: 18px; }
  .slider-row {
    display: grid;
    grid-template-columns: 66px 1fr 56px;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--text-muted);
  }
  .slider-val { text-align: right; color: var(--text); }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    background: var(--tx);
    border-radius: 3px;
    cursor: pointer;
    margin-top: -1px;
  }
  input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px;
    background: var(--tx);
    border: none;
    border-radius: 3px;
    cursor: pointer;
  }
  #rxPanel input[type="range"]::-webkit-slider-thumb { background: var(--rx); }
  #rxPanel input[type="range"]::-moz-range-thumb { background: var(--rx); }

  .btn-primary {
    display: block;
    width: 100%;
    padding: 14px;
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 13.5px;
    letter-spacing: 0.06em;
    border-radius: 7px;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    border: 1px solid var(--tx);
    background: var(--tx-dim);
    color: var(--tx);
    transition: background 0.15s, color 0.15s, opacity 0.15s;
  }
  .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-primary.is-active { background: var(--tx); color: var(--bg); }

  .rx-btn { border-color: var(--rx); background: var(--rx-dim); color: var(--rx); margin-bottom: 16px; }
  .rx-btn.is-active { background: var(--rx); color: var(--bg); }

  .download-btn {
    border-color: var(--good);
    background: rgba(110, 231, 168, 0.12);
    color: var(--good);
    margin-top: 16px;
  }
  .reset-btn { margin-top: 10px; width: 100%; text-align: center; }

  .viewfinder {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #000;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .viewfinder.complete { border-color: var(--good); }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .reticle { position: absolute; inset: 14%; pointer-events: none; }
  .corner { position: absolute; width: 20px; height: 20px; border: 2px solid var(--rx); opacity: 0.8; }
  .viewfinder.complete .corner { border-color: var(--good); }
  .corner.tl { top: 0; left: 0; border-right: none; border-bottom: none; }
  .corner.tr { top: 0; right: 0; border-left: none; border-bottom: none; }
  .corner.bl { bottom: 0; left: 0; border-right: none; border-top: none; }
  .corner.br { bottom: 0; right: 0; border-left: none; border-top: none; }

  .packet-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
    margin-bottom: 6px;
    min-height: 11px;
  }
  .packet-cell {
    width: 10px; height: 10px;
    border-radius: 2px;
    background: var(--bg-panel-raised);
    border: 1px solid var(--border);
  }
  .packet-cell.got {
    background: var(--rx);
    border-color: var(--rx);
    animation: pulse 0.35s ease;
  }
  @keyframes pulse { 0% { transform: scale(1.7); } 100% { transform: scale(1); } }

  .foot {
    text-align: center;
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--text-dim);
    margin-top: 26px;
  }

  @media (prefers-reduced-motion: reduce) {
    .scan-sweep, .packet-cell.got { animation: none !important; }
    .rocker-thumb, .meter-fill { transition: none !important; }
  }
</style>
</head>
<body>
<div class="shell">

  <header class="topbar">
    <div class="wordmark">AIRGAP</div>
    <div class="tagline">file transfer over qr · no network required</div>
  </header>

  <div class="rocker" id="rocker" data-active="tx" role="radiogroup" aria-label="Mode">
    <button class="rocker-half tx-half" data-mode="tx" role="radio" aria-checked="true">TX</button>
    <button class="rocker-half rx-half" data-mode="rx" role="radio" aria-checked="false">RX</button>
    <div class="rocker-thumb"></div>
  </div>

  <!-- ============ TX PANEL ============ -->
  <section class="panel" id="txPanel">
    <div class="file-row">
      <button class="btn-outline" id="chooseFileBtn" type="button">choose file</button>
      <input type="file" id="fileInput" hidden />
      <div class="file-readout" id="fileReadout">no file loaded</div>
    </div>

    <div class="qr-frame" id="qrFrame">
      <div id="qrcode"></div>
      <div class="scan-sweep"></div>
      <div class="msg-overlay" id="qrIdleMsg">load a file to begin</div>
    </div>

    <div class="readout-strip">
      <div class="readout">
        <span class="readout-label">packet</span>
        <span class="readout-value" id="pktReadout" aria-live="polite">–/–</span>
      </div>
      <div class="readout">
        <span class="readout-label">loop</span>
        <span class="readout-value" id="loopReadout">0</span>
      </div>
      <div class="readout">
        <span class="readout-label">session</span>
        <span class="readout-value" id="sessReadout">––––</span>
      </div>
    </div>

    <div class="meter"><div class="meter-fill" id="meterFill"></div></div>

    <div class="controls">
      <label class="slider-row">
        <span>packet</span>
        <input type="range" id="chunkSizeSlider" min="150" max="900" step="50" value="300" />
        <span class="slider-val" id="chunkSizeVal">300 B</span>
      </label>
      <label class="slider-row">
        <span>interval</span>
        <input type="range" id="intervalSlider" min="120" max="1000" step="20" value="600" />
        <span class="slider-val" id="intervalVal">600 ms</span>
      </label>
    </div>

    <button class="btn-primary" id="txToggleBtn" disabled>transmit</button>
    <button class="btn-outline" id="exportQrBtn" type="button" style="margin-top:10px;">export current QR</button>
  </section>

  <!-- ============ RX PANEL ============ -->
  <section class="panel hidden" id="rxPanel">
    <div class="viewfinder" id="viewfinder">
      <video id="video" playsinline muted></video>
      <div class="reticle">
        <span class="corner tl"></span><span class="corner tr"></span>
        <span class="corner bl"></span><span class="corner br"></span>
      </div>
      <div class="msg-overlay" id="viewfinderMsg">point camera at TX screen</div>
    </div>

    <button class="btn-primary rx-btn" id="rxToggleBtn">start camera</button>

    <div style="display:flex;gap:10px;margin-bottom:10px;">
      <label class="btn-outline" style="display:inline-flex;align-items:center;gap:8px;cursor:pointer;">
        Test QR image
        <input id="qrImageInput" type="file" accept="image/*" style="display:none" />
      </label>
      <span style="font-family:var(--font-mono);font-size:12px;color:var(--text-dim);align-self:center;">(upload PNG from TX)</span>
    </div>

    <div class="readout-strip">
      <div class="readout">
        <span class="readout-label">file</span>
        <span class="readout-value" id="rxFileReadout">–</span>
      </div>
      <div class="readout">
        <span class="readout-label">packets</span>
        <span class="readout-value" id="rxPktReadout" aria-live="polite">–/–</span>
      </div>
    </div>

    <div class="packet-grid hidden" id="packetGrid"></div>

    <a class="btn-primary download-btn hidden" id="downloadBtn">download file</a>
    <button class="btn-outline reset-btn hidden" id="rxResetBtn" type="button">scan a new file</button>
  </section>

  <footer class="foot">runs client-side in this tab · nothing leaves your device</footer>
</div>

<script>
(function () {
  'use strict';

  /* ================= shared packet protocol =================
     H|sessionId|numChunks|filesize|mimetype|filename
     D|sessionId|index|base64piece
  ================================================================ */

  function arrayBufferToBase64(buffer) {
    let binary = '';
    const bytes = new Uint8Array(buffer);
    const chunkSize = 0x8000;
    for (let i = 0; i < bytes.length; i += chunkSize) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
    }
    return btoa(binary);
  }

  function base64ToBytes(base64) {
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  function genSessionId() {
    return Math.random().toString(36).slice(2, 6);
  }

  function buildHeaderPacket(sessionId, numChunks, filesize, mimetype, filename) {
    return 'H|' + sessionId + '|' + numChunks + '|' + filesize + '|' + mimetype + '|' + filename;
  }
  function buildDataPacket(sessionId, index, piece) {
    return 'D|' + sessionId + '|' + index + '|' + piece;
  }

  function parsePacket(raw) {
    if (typeof raw !== 'string') raw = String(raw || '');
    raw = raw.trim();
    if (raw.length < 3) return null;
    const parts = raw.split('|');
    const type = parts[0];
    if (type === 'H' && parts.length >= 6) {
      return {
        type: 'H',
        sessionId: parts[1],
        numChunks: parseInt(parts[2], 10),
        filesize: parseInt(parts[3], 10),
        mimetype: parts[4],
        filename: parts.slice(5).join('|'),
      };
    }
    if (type === 'D' && parts.length >= 4) {
      const index = parseInt(parts[2], 10);
      if (Number.isNaN(index)) return null;
      return { type: 'D', sessionId: parts[1], index: index, data: parts.slice(3).join('|') };
    }
    return null;
  }

  function formatBytes(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1024 / 1024).toFixed(2) + ' MB';
  }

  /* ================= mode switch ================= */
  const rocker = document.getElementById('rocker');
  const txPanel = document.getElementById('txPanel');
  const rxPanel = document.getElementById('rxPanel');

  function setMode(mode) {
    rocker.dataset.active = mode;
    rocker.querySelectorAll('.rocker-half').forEach(function (btn) {
      btn.setAttribute('aria-checked', String(btn.dataset.mode === mode));
    });
    txPanel.classList.toggle('hidden', mode !== 'tx');
    rxPanel.classList.toggle('hidden', mode !== 'rx');
    if (mode !== 'rx') stopCamera();
    if (mode !== 'tx') stopTransmit();
  }
  rocker.querySelectorAll('.rocker-half').forEach(function (btn) {
    btn.addEventListener('click', function () { setMode(btn.dataset.mode); });
  });

  /* ================= TX ================= */
  const fileInput = document.getElementById('fileInput');
  const chooseFileBtn = document.getElementById('chooseFileBtn');
  const fileReadout = document.getElementById('fileReadout');
  const qrFrame = document.getElementById('qrFrame');
  const qrIdleMsg = document.getElementById('qrIdleMsg');
  const pktReadout = document.getElementById('pktReadout');
  const loopReadout = document.getElementById('loopReadout');
  const sessReadout = document.getElementById('sessReadout');
  const meterFill = document.getElementById('meterFill');
  const chunkSizeSlider = document.getElementById('chunkSizeSlider');
  const chunkSizeVal = document.getElementById('chunkSizeVal');
  const intervalSlider = document.getElementById('intervalSlider');
  const intervalVal = document.getElementById('intervalVal');
  const txToggleBtn = document.getElementById('txToggleBtn');
  const exportQrBtn = document.getElementById('exportQrBtn');

  let qr = null;
  try {
    qr = new QRCode(document.getElementById('qrcode'), {
      width: 260,
      height: 260,
      colorDark: '#000000',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M,
    });
  } catch (e) {
    console.error('QRCode init failed', e);
  }
  if (!qr) {
    qrIdleMsg.textContent = 'qr library failed to load — check connection and reload';
  }

  let fileBuffer = null;
  let fileMeta = null;
  let packets = [];
  let txTimer = null;
  let txIndex = 0;
  let loopCount = 0;
  let sessionId = null;
  let txRepeat = 0;
  const REPEAT_PER_PACKET = 3;

  chooseFileBtn.addEventListener('click', function () { fileInput.click(); });

  fileInput.addEventListener('change', async function () {
    const file = fileInput.files[0];
    if (!file) return;
    stopTransmit();
    fileMeta = { name: file.name, size: file.size, type: file.type || 'application/octet-stream' };
    fileBuffer = await file.arrayBuffer();
    buildPackets();
    txToggleBtn.disabled = !qr;
  });

  function buildPackets() {
    const chunkChars = parseInt(chunkSizeSlider.value, 10);
    const b64 = arrayBufferToBase64(fileBuffer);
    sessionId = genSessionId();
    const dataPieces = [];
    for (let i = 0; i < b64.length; i += chunkChars) {
      dataPieces.push(b64.slice(i, i + chunkChars));
    }
    packets = [buildHeaderPacket(sessionId, dataPieces.length, fileMeta.size, fileMeta.type, fileMeta.name)];
    dataPieces.forEach(function (p, idx) { packets.push(buildDataPacket(sessionId, idx, p)); });

    sessReadout.textContent = sessionId;
    loopCount = 0;
    loopReadout.textContent = '0';
    txIndex = 0;
    txRepeat = 0;

    const big = packets.length > 600 ? ' (large — several loops needed)' : '';
    fileReadout.textContent = fileMeta.name + ' · ' + formatBytes(fileMeta.size) + ' · ' + packets.length + ' pkts' + big;

    renderPacket(0);
  }

  function renderPacket(i) {
    if (!qr || !packets.length) return;
    try {
      // ensure qrcode element is updated
      // qrcode.js will render an <img> or <canvas>
      qr.makeCode(packets[i]);
      qrIdleMsg.classList.add('hidden');
    } catch (e) {
      qrIdleMsg.textContent = 'packet too dense to encode — lower the packet size';
      qrIdleMsg.classList.remove('hidden');
      stopTransmit();
      return;
    }
    pktReadout.textContent = (i + 1) + '/' + packets.length;
    meterFill.style.width = (((i + 1) / packets.length) * 100) + '%';
  }

  function stepTx() {
    txRepeat++;
    if (txRepeat < REPEAT_PER_PACKET) {
      // repeat same packet for reliability
      renderPacket(txIndex);
      return;
    }
    txRepeat = 0;
    txIndex++;
    if (txIndex >= packets.length) {
      txIndex = 0;
      loopCount++;
      loopReadout.textContent = String(loopCount);
    }
    renderPacket(txIndex);
  }

  function startTransmit() {
    if (!packets.length || !qr) return;
    qrFrame.classList.add('active');
    txToggleBtn.textContent = 'stop';
    txToggleBtn.classList.add('is-active');
    const interval = parseInt(intervalSlider.value, 10);
    // show first packet immediately and start cycling
    renderPacket(txIndex);
    txTimer = setInterval(stepTx, interval);
  }
  function stopTransmit() {
    if (txTimer) clearInterval(txTimer);
    txTimer = null;
    qrFrame.classList.remove('active');
    txToggleBtn.textContent = 'transmit';
    txToggleBtn.classList.remove('is-active');
  }
  txToggleBtn.addEventListener('click', function () {
    if (txTimer) stopTransmit(); else startTransmit();
  });

  chunkSizeSlider.addEventListener('input', function () {
    chunkSizeVal.textContent = chunkSizeSlider.value + ' B';
  });
  chunkSizeSlider.addEventListener('change', function () {
    if (fileBuffer) { stopTransmit(); buildPackets(); }
  });
  intervalSlider.addEventListener('input', function () {
    intervalVal.textContent = intervalSlider.value + ' ms';
    if (txTimer) {
      clearInterval(txTimer);
      txTimer = setInterval(stepTx, parseInt(intervalSlider.value, 10));
    }
  });

  // export current qr displayed inside #qrcode as PNG (for static testing)
  exportQrBtn.addEventListener('click', function () {
    const qrEl = document.getElementById('qrcode');
    const img = qrEl.querySelector('img');
    const canvas = qrEl.querySelector('canvas');
    let dataUrl = null;
    if (img && img.src && img.src.indexOf('data:') === 0) dataUrl = img.src;
    else if (canvas) dataUrl = canvas.toDataURL('image/png');
    if (!dataUrl) {
      alert('No QR available to export (generate one first).');
      return;
    }
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = (fileMeta && fileMeta.name ? 'airgap-' + fileMeta.name + '-pkt' + (txIndex+1) + '.png' : 'airgap-qr.png');
    document.body.appendChild(a);
    a.click();
    a.remove();
  });

  /* ================= RX ================= */
  const video = document.getElementById('video');
  const viewfinder = document.getElementById('viewfinder');
  const viewfinderMsg = document.getElementById('viewfinderMsg');
  const rxToggleBtn = document.getElementById('rxToggleBtn');
  const rxFileReadout = document.getElementById('rxFileReadout');
  const rxPktReadout = document.getElementById('rxPktReadout');
  const packetGrid = document.getElementById('packetGrid');
  const downloadBtn = document.getElementById('downloadBtn');
  const rxResetBtn = document.getElementById('rxResetBtn');
  const qrImageInput = document.getElementById('qrImageInput');

  let stream = null;
  let detector = null;
  let detectTimer = null;
  let detecting = false;
  let scanCanvas = null;
  let scanCtx = null;

  let rxSessionId = null;
  let rxHeader = null;
  let rxChunks = new Map();
  let currentDownloadUrl = null;

  function supportsDetector() {
    return typeof jsQR === 'function' || 'BarcodeDetector' in window;
  }

  async function startCamera() {
    if (!supportsDetector()) {
      viewfinderMsg.textContent = 'QR scanner library failed to load — check internet access and reload.';
      viewfinderMsg.classList.remove('hidden');
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      viewfinderMsg.textContent = 'camera api unavailable here — this page needs https.';
      viewfinderMsg.classList.remove('hidden');
      return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } },
        audio: false,
      });
    } catch (e) {
      console.error('Camera error:', e.name, e.message, e);
      let msg = 'camera error: ' + (e.name || 'unknown');
      if (e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError') {
        msg = 'camera permission denied. Allow camera access for this site, then reload.';
      } else if (e.name === 'NotFoundError') {
        msg = 'no camera found on this device.';
      } else if (e.name === 'NotReadableError') {
        msg = 'camera is busy or unavailable. Close other camera apps and retry.';
      } else if (e.name === 'SecurityError') {
        msg = 'camera blocked by browser security. Open this page from HTTPS or localhost.';
      }
      viewfinderMsg.textContent = msg;
      viewfinderMsg.classList.remove('hidden');
      return;
    }

    console.log('[RX] camera stream obtained', stream);
    video.srcObject = stream;
    try {
      await video.play();
    } catch (e) {
      console.error('Video play error:', e);
      stopCamera();
      viewfinderMsg.textContent = 'camera started but video could not play: ' + (e.name || e.message || e);
      viewfinderMsg.classList.remove('hidden');
      return;
    }

    detector = ('BarcodeDetector' in window)
      ? new BarcodeDetector({ formats: ['qr_code'] })
      : null;

    if (!scanCanvas) {
      scanCanvas = document.createElement('canvas');
      scanCtx = scanCanvas.getContext('2d', { willReadFrequently: true });
    }

    viewfinderMsg.classList.add('hidden');
    rxToggleBtn.textContent = 'stop camera';
    rxToggleBtn.classList.add('is-active');

    console.log('[RX] video dims after play', video.videoWidth, video.videoHeight);
    // use interval-based tick to avoid overloading CPU on some devices
    detectTimer = setInterval(tick, 180);
  }

  function stopCamera() {
    if (detectTimer) clearInterval(detectTimer);
    detectTimer = null;
    if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
    stream = null;
    video.srcObject = null;
    rxToggleBtn.textContent = 'start camera';
    rxToggleBtn.classList.remove('is-active');
  }

  async function tick() {
    if (detecting || !video.videoWidth || !video.videoHeight) return;
    detecting = true;
    try {
      if (typeof jsQR === 'function') {
        const maxWidth = 960;
        const scale = Math.min(1, maxWidth / video.videoWidth);
        const w = Math.max(1, Math.round(video.videoWidth * scale));
        const h = Math.max(1, Math.round(video.videoHeight * scale));

        if (scanCanvas.width !== w || scanCanvas.height !== h) {
          scanCanvas.width = w;
          scanCanvas.height = h;
        }

        scanCtx.drawImage(video, 0, 0, w, h);
        const image = scanCtx.getImageData(0, 0, w, h);
        const code = jsQR(image.data, image.width, image.height, {
          inversionAttempts: 'attemptBoth'
        });

        if (code && code.data) {
          console.log('[RX] jsQR decoded raw (preview):', code.data.slice(0,200));
          handlePacket(code.data);
        }
      } else if (detector) {
        const codes = await detector.detect(video);
        if (codes && codes.length && codes[0].rawValue) {
          console.log('[RX] BarcodeDetector raw (preview):', String(codes[0].rawValue).slice(0,200));
          handlePacket(codes[0].rawValue);
        }
      }
    } catch (e) {
      console.debug('QR decode miss:', e);
    } finally {
      detecting = false;
    }
  }

  function handlePacket(raw) {
    try {
      console.log('[RX] handlePacket raw (preview):', (typeof raw === 'string' ? raw.slice(0,200) : raw));
      const parsed = parsePacket(raw);
      console.log('[RX] parsed packet:', parsed);
      if (!parsed) return;

      if (rxSessionId === null) {
        rxSessionId = parsed.sessionId; 
        console.log('[RX] new session', rxSessionId);
      } else if (parsed.sessionId !== rxSessionId) {
        console.log('[RX] ignoring packet for session', parsed.sessionId);
        return;
      }

      if (parsed.type === 'H' && !rxHeader) {
        rxHeader = parsed;
        rxFileReadout.textContent = parsed.filename + ' · ' + formatBytes(parsed.filesize);
        buildGrid(parsed.numChunks);
        rxChunks.forEach(function (_, idx) { markCell(idx); });
        rxPktReadout.textContent = rxChunks.size + '/' + parsed.numChunks;
        checkComplete();
      } else if (parsed.type === 'D') {
        if (!rxChunks.has(parsed.index)) {
          rxChunks.set(parsed.index, parsed.data);
          markCell(parsed.index);
          if (rxHeader) rxPktReadout.textContent = rxChunks.size + '/' + rxHeader.numChunks;
          checkComplete();
        }
      }
    } catch (e) {
      console.error('[RX] handlePacket error', e);
    }
  }

  function buildGrid(n) {
    packetGrid.innerHTML = '';
    packetGrid.classList.remove('hidden');
    const frag = document.createDocumentFragment();
    for (let i = 0; i < n; i++) {
      const cell = document.createElement('div');
      cell.className = 'packet-cell';
      frag.appendChild(cell);
    }
    packetGrid.appendChild(frag);
  }
  function markCell(i) {
    const cell = packetGrid.children[i];
    if (cell) cell.classList.add('got');
  }

  function checkComplete() {
    if (!rxHeader || rxChunks.size !== rxHeader.numChunks) return;

    let b64 = '';
    for (let i = 0; i < rxHeader.numChunks; i++) {
      const piece = rxChunks.get(i);
      if (typeof piece !== 'string') {
        viewfinderMsg.textContent = 'missing piece ' + i + ' — tap "scan a new file" and try again.';
        viewfinderMsg.classList.remove('hidden');
        return;
      }
      b64 += piece;
    }

    let bytes;
    try {
      bytes = base64ToBytes(b64);
    } catch (e) {
      viewfinderMsg.textContent = 'decode failed — tap "scan a new file" and try again.';
      viewfinderMsg.classList.remove('hidden');
      console.error('[RX] base64 -> bytes failed', e);
      return;
    }

    const blob = new Blob([bytes], { type: rxHeader.mimetype || 'application/octet-stream' });
    if (currentDownloadUrl) URL.revokeObjectURL(currentDownloadUrl);
    currentDownloadUrl = URL.createObjectURL(blob);

    downloadBtn.href = currentDownloadUrl;
    downloadBtn.download = rxHeader.filename || 'received-file';
    downloadBtn.textContent = 'download ' + (rxHeader.filename || 'file');
    downloadBtn.classList.remove('hidden');
    rxResetBtn.classList.remove('hidden');

    stopCamera();
    viewfinder.classList.add('complete');
    viewfinderMsg.textContent = 'transfer complete';
    viewfinderMsg.classList.add('complete-msg');
    viewfinderMsg.classList.remove('hidden');
    console.log('[RX] transfer complete, file ready for download');
  }

  function resetRx() {
    rxSessionId = null;
    rxHeader = null;
    rxChunks = new Map();
    packetGrid.innerHTML = '';
    packetGrid.classList.add('hidden');
    rxFileReadout.textContent = '–';
    rxPktReadout.textContent = '–/–';
    downloadBtn.classList.add('hidden');
    rxResetBtn.classList.add('hidden');
    viewfinder.classList.remove('complete');
    viewfinderMsg.classList.remove('complete-msg');
    viewfinderMsg.textContent = 'point camera at TX screen';
    viewfinderMsg.classList.remove('hidden');
    if (currentDownloadUrl) { URL.revokeObjectURL(currentDownloadUrl); currentDownloadUrl = null; }
    console.log('[RX] reset');
  }

  rxToggleBtn.addEventListener('click', function () {
    if (stream) {
      stopCamera();
      viewfinderMsg.textContent = 'point camera at TX screen';
      viewfinderMsg.classList.remove('hidden');
    } else {
      startCamera();
    }
  });
  rxResetBtn.addEventListener('click', function () {
    resetRx();
    startCamera();
  });

  // test QR image input (static)
  qrImageInput.addEventListener('change', function () {
    const f = qrImageInput.files && qrImageInput.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = function (ev) {
      const img = new Image();
      img.onload = function () {
        if (!scanCanvas) {
          scanCanvas = document.createElement('canvas');
          scanCtx = scanCanvas.getContext('2d', { willReadFrequently: true });
        }
        scanCanvas.width = img.naturalWidth;
        scanCanvas.height = img.naturalHeight;
        scanCtx.drawImage(img, 0, 0);
        const image = scanCtx.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
        try {
          const code = (typeof jsQR === 'function') ? jsQR(image.data, image.width, image.height, { inversionAttempts: 'attemptBoth' }) : null;
          if (code && code.data) {
            console.log('[RX] static image decoded (preview):', String(code.data).slice(0,200));
            handlePacket(code.data);
          } else {
            alert('No QR decoded from that image. Try increasing QR size or using export from TX.');
          }
        } catch (e) {
          console.error('[RX] static decode error', e);
          alert('Error decoding image: ' + e.message);
        }
      };
      img.onerror = function () { alert('Could not load image.'); };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(f);
  });

  /* ================= init ================= */
  setMode('tx');
  resetRx();
})();
</script>
</body>
</html>
